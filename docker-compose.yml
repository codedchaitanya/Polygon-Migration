# Local PostgreSQL + Redis for development.
# Values match PolygonMigration/.env.example. Start with: docker compose up -d
services:
  postgres:
    image: postgres:15
    container_name: polygon-postgres
    environment:
      POSTGRES_DB: polygon_migration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polygon_migration"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: polygon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional local Azure Blob Storage emulator, for testing uploads without an
  # Azure account. Start with: docker compose --profile azurite up -d
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: polygon-azurite
    profiles: ["azurite"]
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
    restart: unless-stopped

volumes:
  pgdata:
